# The Cloudflare Worker that fetches the hiscores for the site, since browsers can't read them
# from another site, and shares the Wiki's prices between visitors.
# Free plan: 100,000 requests a day, and it is never billed.
name = "osrs-gear-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"
# The site's address for it, where Cloudflare's cache works. The workers.dev one stays as well.
routes = [{ pattern = "api.bisonabudget.com", custom_domain = true }]
workers_dev = true

[vars]
# The sites allowed to ask, comma-separated.
ALLOWED_ORIGINS = "https://bisonabudget.com,https://www.bisonabudget.com,http://localhost:5173"

# Each visitor (by IP address) gets this many lookups a minute.
[[ratelimits]]
name = "LOOKUPS"
namespace_id = "1001"
simple = { limit = 10, period = 60 }
